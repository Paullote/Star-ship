<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>star ship</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            border: 2px solid white;
        }

        .vitoria {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="vitoria" class="vitoria" style="display: none;">end :)</div>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const naveWidth = 50, naveHeight = 50;
        const inimigoWidth = 50, inimigoHeight = 50;
        const disparoWidth = 5, disparoHeight = 10;
        let naveX = canvas.width - naveWidth - 10, naveY = canvas.height / 2 - naveHeight / 2;
        let disparos = [];
        let inimigos = [];
        let loopDirection = 1; // 1 para mover da direita para a esquerda, -1 para da esquerda para a direita
        let disparando = false;
        let inimigosDestruidos = 0;
        let intervaloDisparo = 500; // Intervalo de disparo em milissegundos
        let ultimoDisparo = Date.now();
        let jogoAtivo = true;

        // Função para criar inimigos
        function criarInimigos() {
            inimigos = [];
            for (let i = 0; i < 19; i++) {
                inimigos.push({
                    x: i * (canvas.width / 20),
                    y: 50,
                    width: inimigoWidth,
                    height: inimigoHeight,
                    ativo: true
                });
            }
        }

        // Função para desenhar a nave
        function desenharNave() {
            ctx.fillStyle = "white";
            ctx.fillRect(naveX, naveY, naveWidth, naveHeight);
        }

        // Função para desenhar os disparos
        function desenharDisparos() {
            ctx.fillStyle = "white";
            disparos.forEach(disparo => {
                ctx.fillRect(disparo.x, disparo.y, disparoWidth, disparoHeight);
            });
        }

        // Função para desenhar os inimigos
        function desenharInimigos() {
            ctx.fillStyle = "white";
            inimigos.forEach(inimigo => {
                if (inimigo.ativo) {
                    ctx.fillRect(inimigo.x, inimigo.y, inimigoWidth, inimigoHeight);
                }
            });
        }

        // Função para verificar colisões
        function verificarColisoes() {
            disparos.forEach((disparo, index) => {
                inimigos.forEach(inimigo => {
                    if (inimigo.ativo &&
                        disparo.x < inimigo.x + inimigoWidth &&
                        disparo.x + disparoWidth > inimigo.x &&
                        disparo.y < inimigo.y + inimigoHeight &&
                        disparo.y + disparoHeight > inimigo.y) {
                        // Colisão detectada, destrui o inimigo
                        inimigo.ativo = false;
                        disparos.splice(index, 1); // Remove o disparo
                        inimigosDestruidos++;

                        // Verifica se todos os inimigos foram destruídos
                        if (inimigosDestruidos === inimigos.length) {
                            setTimeout(() => {
                                mostrarTelaVitoria();
                            }, 200);
                        }
                    }
                });
            });
        }

        // Função para atualizar a posição da nave
        function moverNave() {
            if (loopDirection === 1 && naveX > 10) {
                naveX -= 5;
            } else if (loopDirection === -1 && naveX < canvas.width - naveWidth - 10) {
                naveX += 5;
            }

            if (naveX <= 10 || naveX >= canvas.width - naveWidth - 10) {
                loopDirection *= -1;
            }
        }

        // Função para atualizar os disparos
        function moverDisparos() {
            disparos.forEach(disparo => {
                disparo.y -= 10;
            });
            disparos = disparos.filter(disparo => disparo.y > 0); // Remove disparos fora da tela
        }

        // Função para exibir a tela de vitória
        function mostrarTelaVitoria() {
            document.getElementById("vitoria").style.display = "block";
        }

        // Função para reiniciar o jogo
        function reiniciarJogo() {
            inimigosDestruidos = 0;
            disparos = [];
            criarInimigos();
            naveX = canvas.width - naveWidth - 10;
            naveY = canvas.height / 2 - naveHeight / 2;
            loopDirection = 1;
            jogoAtivo = true;
            document.getElementById("vitoria").style.display = "none";
        }

        // Função para tratar o disparo
        function disparar() {
            if (Date.now() - ultimoDisparo >= intervaloDisparo) {
                disparos.push({ x: naveX + naveWidth / 2 - disparoWidth / 2, y: naveY });
                ultimoDisparo = Date.now();
            }
        }

        // Função para tratar o pressionamento de teclas
        function controleTeclado(e) {
            if (e.code === "Space" && jogoAtivo) {
                disparar();
            } else if (e.code === "Space" && !jogoAtivo) {
                reiniciarJogo();
            }
        }

        // Função de atualização do jogo
        function atualizar() {
            if (!jogoAtivo) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            moverNave();
            moverDisparos();
            verificarColisoes();

            desenharNave();
            desenharDisparos();
            desenharInimigos();
        }

        // Função de loop do jogo
        function loop() {
            atualizar();
            requestAnimationFrame(loop);
        }

        // Inicialização do jogo
        criarInimigos();
        loop();

        // Evento de teclado
        document.addEventListener("keydown", controleTeclado);
    </script>
</body>
</html>
